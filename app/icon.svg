<?xml version="1.0" encoding="UTF-8"?>
<!--
  app/icon.svg — favicon do site (convenção do App Router).

  Por que este arquivo existe
  - Nenhuma rota declarava ícone, então todo navegador caía no pedido automático
    de /favicon.ico, que não existia: 404 garantido em cada primeira visita.
  - O App Router serve app/icon.svg em /icon.svg e injeta <link rel="icon"> no
    head do layout raiz. Com o link presente, o navegador para de pedir
    /favicon.ico sozinho.

  A marca são três barras ascendentes: "gradual" em forma, sem depender de
  fonte instalada (texto em SVG de favicon renderia diferente em cada sistema).
  O gradiente usa os tokens de marca de app/globals.css em hex equivalente:
  --color-brand-500 (oklch(0.62 0.17 250) ~ #0f89e7) e --color-brand-600
  (oklch(0.55 0.17 250) ~ #0073cf).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gradualinfo">
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f89e7"/>
      <stop offset="1" stop-color="#0073cf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#marca)"/>
  <g fill="#ffffff">
    <rect x="14" y="30" width="9" height="20" rx="4.5"/>
    <rect x="27.5" y="20" width="9" height="30" rx="4.5"/>
    <rect x="41" y="10" width="9" height="40" rx="4.5"/>
  </g>
</svg>
