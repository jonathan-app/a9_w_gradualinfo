name: CI

# ============================================================================
# CI — gate completo, em ordem de custo crescente
# ============================================================================
# Fluxo alvo:
#   PR
#   ├── typecheck
#   ├── lint
#   ├── prettier
#   ├── unit
#   ├── E2E
#   ├── build
#   ├── RLS
#   ├── SAST
#   ├── dependency scan
#   ├── secrets
#   ├── Lighthouse
#   └── /check gate
#            ↓
#         APPROVED
#
# O pre-commit fica leve (lint/typecheck/format). O gate de aprovação
# fica na CI/PR, ligado a uma decisão /check aprovada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Testes unitários
        run: pnpm test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build do Next
        run: pnpm build:next

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar browsers do Playwright
        run: pnpm exec playwright install chromium

      - name: Executar E2E
        run: pnpm test:e2e

      - name: Preservar relatório E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

  database:
    name: Banco local e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Iniciar stack descartável
        run: pnpm supabase:start
      - name: Aplicar migrations e seed local
        run: pnpm supabase:reset --local
      - name: Executar pgTAP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results
          pnpm supabase:test 2>&1 | tee ci-results/pgtap.log
      - name: Preservar resultado do pgTAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-pgtap
          path: ci-results/pgtap.log
          if-no-files-found: warn
      - name: Encerrar stack local
        if: always()
        run: pnpm supabase:stop --no-backup

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  dependency-scan:
    name: Dependency scan (OSV + pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: OSV scan
        uses: google/osv-scanner-action@v1
        with:
          scan-args: '-r ./'

  lighthouse:
    name: Lighthouse (home + artigo público)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build do Next
        run: pnpm build:next
      - name: Iniciar servidor
        run: pnpm next start --port 3000 &
        shell: bash
      - name: Aguardar servidor
        run: npx wait-on http://localhost:3000
      - name: Lighthouse CI
        run: |
          npx lhci autorun \
            --collect.settings.onlyCategories='performance,accessibility,best-practices,seo' \
            --collect.url='http://localhost:3000' \
            --collect.url='http://localhost:3000/artigos/fixture-publicado' \
            --assert.assertions='categories:performance>=80,categories:accessibility>=90,categories:best-practices>=90,categories:seo>=90'

  check-gate:
    name: /check gate
    needs: [quality, build, e2e, database, sast, dependency-scan, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar gate de aprovação
        run: node scripts/check-gate.mjs verify-result.json --commit ${{ github.sha }}
      - name: Preservar resultado do gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-gate
          path: verify-result.json
          if-no-files-found: warn
