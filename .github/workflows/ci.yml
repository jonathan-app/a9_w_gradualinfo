name: CI

# ============================================================================
# CI — o mesmo gate que roda na máquina, em ordem de custo crescente
# ============================================================================
# A ordem importa: o que é mais rápido e pega mais erro vem primeiro, para o
# developer receber o sinal em segundos em vez de minutos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um workflow novo por push cancela o anterior: não faz sentido esperar duas
# versões do mesmo commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, lint, formatação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # allowBuilds em pnpm-workspace.yaml autoriza esbuild/unrs-resolver/
      # workerd; sem --frozen-lockfile o CI instalaria de novo a cada run.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Testes unitários
        run: pnpm test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O build não pode depender de segredo: as variáveis ausentes caem no
      # valor padrão local (ver lib/env.ts).
      - name: Build do Next
        run: pnpm build:next

  security:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks precisa do histórico, não só o último commit

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Auditar dependências
        run: pnpm audit --audit-level=high

      - name: Procurar segredos no histórico
        run: pnpm security:secrets

  database:
    name: Banco local e RLS
    runs-on: ubuntu-latest
    # 30 min, não 20: o download do stack completo do Supabase é a etapa
    # dominante em runner frio. Ajustar depois de observar execuções reais.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os wrappers existentes usam Supabase CLI via pnpm dlx.
      # Alvo exclusivamente local; nenhuma credencial hospedada é necessária.
      - name: Iniciar stack descartável
        run: pnpm supabase:start
      - name: Aplicar migrations e seed local
        run: pnpm supabase:reset --local
      - name: Executar pgTAP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results
          pnpm supabase:test 2>&1 | tee ci-results/pgtap.log
      - name: Preservar resultado do pgTAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-pgtap
          path: ci-results/pgtap.log
          if-no-files-found: warn
      - name: Encerrar stack local
        if: always()
        run: pnpm supabase:stop --no-backup
