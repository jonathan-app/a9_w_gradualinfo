name: CI

# ============================================================================
# CI — gate completo, em ordem de custo crescente
# ============================================================================
# Fluxo alvo (pull request para a main):
#   PR
#   ├── quality        → typecheck, lint, prettier, unit, skills, MCP,
#   │                    pnpm audit e OSV scan
#   ├── security       → gitleaks (histórico) e semgrep
#   ├── e2e            → build + Playwright no servidor compilado
#   ├── database       → migrations, seed e pgTAP
#   ├── lighthouse     → home e artigo público
#   └── check-gate     → matriz do /check para o SHA avaliado
#            ↓
#         APPROVED
#
# O pre-commit fica leve (lint/typecheck/format). O gate de aprovação
# fica na CI/PR, ligado a uma decisão /check aprovada.
#
# Plano Free (2.000 minutos por mês): a pipeline roda uma vez por mudança,
# não duas. O gatilho de `push` saiu de propósito porque o PR já valida
# exatamente a árvore que chega na main; execuções manuais (por exemplo no
# HEAD da main) usam o `workflow_dispatch`. PR que só toca `docs/`,
# `workflow/`, `check/` ou arquivos `.md` não aciona nada. Os dois scanners
# de dependência ficaram no job `quality`, gitleaks e semgrep dividem o job
# `security`, e o job de build avulso foi removido porque `e2e` e
# `lighthouse` já rodam `pnpm build:next` na mesma árvore.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'workflow/**'
      - 'check/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade (tipos, lint, formatação, testes e dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Materializar e validar skills aprovadas
        run: |
          node scripts/materialize-skills.mjs
          node scripts/check-skills.mjs
          node scripts/check-portability.mjs
      - name: Validar catálogo MCP
        run: node scripts/check-mcp-config.mjs

      - name: Checks locais completos
        run: pnpm check:all
      - name: Typecheck E2E
        run: pnpm typecheck:e2e
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: '--lockfile=pnpm-lock.yaml'

  security:
    name: Segredos e SAST (gitleaks + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.9'

      - name: Instalar scanner pinado
        run: python3 -m pip install semgrep==1.179.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Gitleaks pinado e relatórios redigidos
        run: pnpm security:secrets

      # Um scanner não pode esconder o resultado do outro: o segundo roda
      # mesmo quando o primeiro falha, e a falha de qualquer um derruba o job.
      - name: SAST com regras locais
        if: always()
        run: pnpm security:sast

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: security-reports/gitleaks.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: security-reports/semgrep.json
          if-no-files-found: error

  e2e:
    env:
      E2E_NETWORK_FAULTS: '1'
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Baixar o Chromium inteiro a cada execução custa minutos do plano; o
      # cache é seguro porque a chave muda sempre que o lockfile muda.
      - name: Cache dos browsers do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar browsers do Playwright
        run: pnpm exec playwright install chromium

      - name: Iniciar banco descartável e aplicar seed
        run: |
          node scripts/prepare-e2e-db.mjs
          pnpm supabase:start --workdir "$RUNNER_TEMP/e2e-db" || (sleep 10 && pnpm supabase:start --workdir "$RUNNER_TEMP/e2e-db")
          pnpm supabase:reset --local --workdir "$RUNNER_TEMP/e2e-db"
          pnpm --silent supabase:status --workdir "$RUNNER_TEMP/e2e-db" > "$RUNNER_TEMP/supabase-status.json"
      - name: Provisionar preview e artigos de teste
        run: node scripts/ci-fixtures.mjs "$RUNNER_TEMP/supabase-status.json"
      - name: Certificado HTTPS local para provar cookies Secure
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/e2e.key" -out "$RUNNER_TEMP/e2e.crt" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          echo "E2E_TLS_KEY=$RUNNER_TEMP/e2e.key" >> "$GITHUB_ENV"
          echo "E2E_TLS_CERT=$RUNNER_TEMP/e2e.crt" >> "$GITHUB_ENV"
      - name: Build e tipos E2E
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.E2E_SUPABASE_UPSTREAM || 'http://127.0.0.1:54321' }}
        run: |
          pnpm typecheck:e2e
          pnpm build:next
      - name: Registrar revisão E2E
        run: |
          mkdir -p test-results
          node scripts/ci-revision.mjs "$RUNNER_TEMP/e2e-revision.json"
      - name: Executar E2E no servidor compilado com HTTPS
        run: pnpm test:e2e
      - name: Preservar revisão após limpeza do Playwright
        if: always()
        run: |
          mkdir -p test-results
          if [ -f "$RUNNER_TEMP/e2e-revision.json" ]; then
            cp "$RUNNER_TEMP/e2e-revision.json" test-results/e2e-revision.json
          fi
      - name: Encerrar banco descartável
        if: always()
        run: pnpm supabase:stop --no-backup --workdir "$RUNNER_TEMP/e2e-db"

      - name: Preservar relatório E2E
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/results.json
            test-results/e2e-revision.json
          if-no-files-found: warn

  database:
    name: Banco local e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Iniciar stack descartável
        run: pnpm supabase:start || (sleep 10 && pnpm supabase:start)
      - name: Aplicar migrations e seed local
        run: pnpm supabase:reset --local
      - name: Executar pgTAP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results
          node scripts/ci-revision.mjs ci-results/database-revision.json
          pnpm supabase:test 2>&1 | tee ci-results/pgtap.log
      - name: Testes de integração com banco real (Vitest)
        run: pnpm vitest run __tests__/integration/spec-0021-real-db-concurrency.test.ts
      - name: Preservar resultado do pgTAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-pgtap
          path: |
            ci-results/pgtap.log
            ci-results/database-revision.json
          if-no-files-found: warn
      - name: Encerrar stack local
        if: always()
        run: pnpm supabase:stop --no-backup

  lighthouse:
    env:
      CI_FIXTURE_ORIGIN: http://localhost:3000
    name: Lighthouse (home + artigo público)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar banco e fixtures no runner
        run: |
          pnpm supabase:start || (sleep 10 && pnpm supabase:start)
          pnpm supabase:reset --local
          pnpm --silent supabase:status > "$RUNNER_TEMP/supabase-status.json"
          node scripts/ci-fixtures.mjs "$RUNNER_TEMP/supabase-status.json"
      - name: Build do Next
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm build:next
      - name: Iniciar servidor
        run: pnpm next start --port 3000 &
        shell: bash
      - name: Aguardar servidor
        run: node scripts/wait-http.mjs http://localhost:3000/api/health
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - name: Preservar relatório Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Encerrar banco descartável
        if: always()
        run: pnpm supabase:stop --no-backup

  check-gate:
    name: /check gate
    needs: [quality, security, e2e, database, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Obter evidências desta execução
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          merge-multiple: true
          path: ${{ runner.temp }}/check-evidence
      - name: Verificar se o trigger é o branch padrão remoto
        run: node scripts/ci-check-branch.mjs

      - name: Verificar a seleção e todos os gates exigidos
        run: node scripts/ci-check-matrix.mjs "$RUNNER_TEMP/check-matrix" "$RUNNER_TEMP/check-evidence"
      - name: Preservar resultado do gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-gate
          path: |
            ${{ runner.temp }}/check-matrix/
          if-no-files-found: warn
