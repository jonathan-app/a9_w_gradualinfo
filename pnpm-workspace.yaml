# ============================================================================
# pnpm-workspace.yaml
# ============================================================================
# Desde o pnpm 10, ajustes que antes ficavam no campo "pnpm" do package.json
# passaram para cá. Manter as duas cópias não funciona: o pnpm 12 já ignora
# (com WARN) o campo "pnpm" do package.json. Este arquivo é a fonte única.
#
# `packages: ['.']` declara um workspace de um único pacote — o próprio raiz.
# Isso mantém o lockfile no formato de workspace, que é o esperado quando o
# projeto roda com pnpm >= 10.

packages:
  - '.'

# ---------------------------------------------------------------------------
# allowBuilds — pacotes autorizados a executar scripts de instalação
# ---------------------------------------------------------------------------
# Sem esta lista o pnpm 12 aborta com ERR_PNPM_IGNORED_BUILDS. São três
# pacotes com binário nativo, todos necessários:
#   esbuild        → usado pelo Vite/Vitest e pelo Storybook
#   unrs-resolver  → motor de resolução do ESLint (imports)
#   workerd        → runtime do Cloudflare, exigido por wrangler/miniflare
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

# ---------------------------------------------------------------------------
# overrides — versão única e forçada de React e do core do Playwright
# ---------------------------------------------------------------------------
# Motivo: duas cópias de React na mesma árvore quebram hooks (o erro
# "Invalid hook call"). O lockfile pode resolver ^19.x para versões diferentes
# em pacotes transitivos; o override garante uma só.
#
# O playwright-core entra aqui pelo mesmo motivo, com um agravante: pacotes que
# declaram `playwright-core: *` como peer (axe-core, percy) aceitam qualquer
# versão, e um alpha 1.64.0-alpha satisfaz "qualquer" — então basta um
# devDependency que puxe esse alpha para o E2E inteiro passar a rodar em cima
# dele. Fixar 1.63.0 deixa o @playwright/test e seus peers na mesma base.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-vfj7-8cjw-p6xm

overrides:
  react: 19.3.1
  react-dom: 19.3.1
  playwright-core: 1.64.0
  # Fix pnpm audit vulnerabilities:
  # - postcss-selector-parser: quadratic complexity in flat selector parsing (GHSA-rj75-hqrm-r3gf)
  postcss-selector-parser: ^7.1.6
  # - sharp: vulnerability in librsvg dependency CVE-2026-96889 (GHSA-wq5f-xc86-pv6w)
  sharp: ^0.35.5
  # - shell-quote: command injection via line terminator (GHSA-pqg4-j6r4-53mv)
  shell-quote: ^1.11.0
  # O override temporário de `tmp`/`basic-ftp` saiu porque as cadeias que
  # os puxavam (puppeteer-core, proxy-agent, external-editor, via @lhci/cli
  # e @percy/playwright) deixaram de existir no lockfile.

# ---------------------------------------------------------------------------
# peerDependencyRules — como tratar peers que não batem
# ---------------------------------------------------------------------------
# `allowedVersions` silencia apenas o aviso de peer incompatível. O projeto
# já fixa a versão via override acima, então aceitar o aviso é seguro e evita
# travar o install em cada dependência transitiva que declara ^18 || ^19.
peerDependencyRules:
  allowedVersions:
    react: '19.3.1'
    react-dom: '19.3.1'

patchedDependencies:
  '@opennextjs/cloudflare@1.20.10': patches/@opennextjs__cloudflare@1.20.10.patch
