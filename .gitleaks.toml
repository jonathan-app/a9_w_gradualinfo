# Configuração local do Gitleaks — limita alarmes falsos conhecidos.
#
# A PR é para não vazar a NÃO colidir com isso: qualquer segredo real que
# aparecer no git ou na árvore ainda é encontrado, com `dir` ou `git`.

[allowlist]
description = "Achados que não são segredos"
paths = [
  # supabase/.temp é stack local descartável e já está no .gitignore; o
  # próprio scan `dir` não deveria subir por ali, mas ainda sobe porque a
  # varredura atual não respeita .gitignore.
  '''supabase/.temp''',
]
regexes = [
  # Placeholder JWT injetado em lib/env.ts só para o build ter um valor a ler;
  # a assinatura é literalmente "local-development-placeholder-signature".
  '''local-development-placeholder-signature''',
]
