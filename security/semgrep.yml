# ============================================================================
# security/semgrep.yml — regras de SAST específicas deste projeto
# ============================================================================
# Rode com: pnpm security:sast
#
# O Semgrep já traz regras genéricas (p/default). O valor deste arquivo são as
# regras que ninguém escreveu para o seu projeto: aqui ficam os padrões que o
# App Router, o Supabase e a Cloudflare tornam plausíveis — e que o ESLint,
# sozinho, não enxerga.
#
# Como escrever uma boa regra
#   1. um pattern que não dê falso positivo no código legítimo;
#   2. message com o porquê, não só o "o que": quem corrige precisa entender o
#      risco para não simplesmente suprimir a regra;
#   3. pensa no contraexemplo — a linha legítima que NÃO pode ser apontada.
#
# Referência: https://semgrep.dev/docs/writing-rules/pattern-syntax
# ============================================================================

rules:
  # --- Chave de serviço em caminho de cliente -----------------------------
  - id: service-role-key-in-client
    message: >-
      Chave `service_role` em código que pode chegar ao browser. Ela ignora RLS:
      quem a tiver lê e escreve qualquer tabela. Use apenas em Route Handler no
      servidor, e mesmo assim só para operação administrativa.
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern-either:
          - pattern: process.env.SUPABASE_SERVICE_ROLE_KEY
          - pattern: process.env['SUPABASE_SERVICE_ROLE_KEY']
          - pattern: process.env.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY

  # JSON-LD é a única exceção autorizada; skipHtml bloqueia HTML, não injeta.
  - id: unsafe-html-injection
    message: >-
      Injeção HTML fora do serializador autorizado de JSON-LD.
      O corpo Markdown deve ser renderizado como árvore React.
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern: |
          <$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />
      - pattern-not: |
          <script ... type="application/ld+json" dangerouslySetInnerHTML={{ __html: serializeJsonLd(...) }} ... />

  # --- proxy.ts sem matcher ----------------------------------------------
  - id: proxy-without-matcher
    message: >-
      proxy.ts sem `config.matcher` renova a sessão em TODA requisição,
      inclusive em asset estático. Isso multiplica a carga sem necessidade.
    severity: WARNING
    languages: [typescript, javascript]
    paths:
      include:
        - '**/proxy.ts'
        - '**/middleware.ts'
    pattern-regex: '(?s)\A(?!.*export\s+const\s+config\s*=.*matcher).*export\s+async\s+function\s+'

  # --- Consulta a dado no cliente quando dá para ser no servidor ----------
  - id: supabase-query-inside-use-effect
    message: >-
      Consulta ao Supabase dentro de um Client Component. Funciona, mas leva o
      dado e a credencial para o browser e cria uma volta de rede que o
      Streamed Response do App Router não precisa. Se a rota puder ser Server
      Component, a versão no servidor é mais rápida e mais segura.
    severity: INFO
    languages: [typescript, javascript]
    pattern-either:
      - pattern: |
          useEffect(() => { ... $SUPABASE.from(...) ... }, [])
      - pattern: |
          useEffect(async () => { ... $SUPABASE.from(...) ... }, [])
